<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaaragenda</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a1a;padding:1.5rem}
h1{font-size:1.4rem;font-weight:500;margin-bottom:1.5rem;color:#1a1a1a}
#controls{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
#year-label{font-size:22px;font-weight:500;min-width:60px}
.btn{background:transparent;border:1px solid #ccc;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:#1a1a1a}
.btn:hover{background:#efefef}
.btn.accent{border-color:#378add;color:#185fa5}
.btn.accent:hover{background:#e6f1fb}
#legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.legend-dot{width:12px;height:12px;border-radius:2px;flex-shrink:0}
#grid-wrap{overflow-x:auto;margin-bottom:1rem}
table{border-collapse:collapse;font-size:11px}
thead th{color:#888;font-weight:400;text-align:center;padding:2px 3px;min-width:22px;width:22px}
thead th.month-head{text-align:left;min-width:80px;width:80px;padding-left:4px;font-size:12px;color:#1a1a1a;font-weight:500}
tbody td.month-name{font-size:12px;color:#1a1a1a;font-weight:500;padding:2px 4px;vertical-align:middle}
.day-cell{width:22px;height:22px;text-align:center;vertical-align:middle;cursor:pointer;border-radius:3px;position:relative;border:0.5px solid transparent}
.day-cell:hover{border-color:#999}
.day-cell.weekend{background:#1a1a1a}
.day-cell.weekend span{color:#fff}
.day-cell.today{border:1.5px solid #378add !important}
.day-cell span{font-size:10px;line-height:22px;display:block;pointer-events:none;color:#888}
.day-cell.colored span{color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.4)}
.day-cell.colored.light-color span{color:#1a1a1a;text-shadow:none}
.day-cell.has-note::after{content:'';position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0.8}
.day-cell.weekend.has-note::after{background:#aaa}
.day-cell.empty{cursor:default}
#io-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
#import-file{display:none}
#data-info{font-size:12px;color:#888}
#tooltip{position:fixed;background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;display:none;z-index:999;max-width:200px;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
#color-picker-wrap{display:none;position:fixed;z-index:1000;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;flex-direction:column;gap:10px;min-width:220px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
#color-picker-wrap.open{display:flex}
#color-grid{display:grid;grid-template-columns:repeat(8,24px);gap:4px}
.color-swatch{width:24px;height:24px;border-radius:3px;cursor:pointer;border:0.5px solid transparent}
.color-swatch:hover{border-color:#333;transform:scale(1.15)}
.color-swatch.selected{border:2px solid #1a1a1a !important}
#note-input{width:100%;border:1px solid #ddd;border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;resize:none;background:#fff;color:#1a1a1a}
#picker-btns{display:flex;gap:6px}
#picker-btns button{flex:1;font-size:12px;padding:5px 0}
#clear-btn{color:#c0392b;border-color:#f1948a}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 18px;font-size:13px;color:#1a1a1a;display:none;z-index:2000;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
</style>
</head>
<body>

<h1>Jaaragenda</h1>

<div id="controls">
  <button class="btn" id="prev-yr">&#8592;</button>
  <span id="year-label"></span>
  <button class="btn" id="next-yr">&#8594;</button>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1a1a1a"></div>weekend</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div>ingepland</div>
  </div>
</div>

<div id="io-bar">
  <button class="btn accent" id="export-btn"><i class="ti ti-download"></i> exporteer alle jaren</button>
  <button class="btn" id="import-btn"><i class="ti ti-upload"></i> importeer backup</button>
  <input type="file" id="import-file" accept=".json">
  <span id="data-info"></span>
</div>

<div id="grid-wrap"></div>

<div id="tooltip"></div>
<div id="toast"></div>

<div id="color-picker-wrap">
  <div id="color-grid"></div>
  <textarea id="note-input" rows="2" placeholder="notitie (optioneel)"></textarea>
  <div id="picker-btns">
    <button class="btn" id="clear-btn">wis dag</button>
    <button class="btn" id="save-btn">opslaan</button>
  </div>
</div>

<script>
const COLORS=['#4a90d9','#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00bcd4','#8bc34a','#ff5722','#607d8b','#795548','#ffc107','#673ab7','#009688','#f06292','#aed6f1','#a9dfbf','#f1948a','#f8c471','#c39bd3','#76d7c4','#f0e68c','#d3d3d3','#ffb347','#b0c4de','#98fb98','#dda0dd','#87ceeb','#f4a460','#20b2aa','#ff6347','#6495ed','#da70d6','#3d9970','#ff851b','#0074d9','#85144b','#39cccc','#01ff70','#ffdc00','#7fdbff','#f012be','#b10dc9','#aaaaaa','#dddddd','#ffffff','#111111','#2c3e50','#c0392b','#27ae60','#8e44ad'];
const LIGHT_COLORS=new Set(['#f0e68c','#d3d3d3','#aed6f1','#a9dfbf','#f8c471','#76d7c4','#f1948a','#c39bd3','#b0c4de','#ffb347','#87ceeb','#98fb98','#dda0dd','#f4a460','#aaaaaa','#dddddd','#ffffff','#7fdbff','#ffdc00','#01ff70']);
const MONTHS_NL=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const DAYS_IN_MONTH=(y,m)=>new Date(y,m+1,0).getDate();
const IS_WEEKEND=(y,m,d)=>{const w=new Date(y,m,d).getDay();return w===0||w===6;};
const TODAY=new Date();
let currentYear=TODAY.getFullYear();
let data={};
let pickerTarget=null;
let selectedColor=COLORS[0];

function storageKey(y){return 'yc_'+y;}
function loadYear(y){try{const r=localStorage.getItem(storageKey(y));return r?JSON.parse(r):{};}catch(e){return {};}}
function saveYear(y,d){try{localStorage.setItem(storageKey(y),JSON.stringify(d));}catch(e){}}
function dayKey(m,d){return m+'-'+d;}

function getAllStoredYears(){
  const years={};
  for(let k in localStorage){
    if(k.startsWith('yc_')){
      const y=k.slice(3);
      try{years[y]=JSON.parse(localStorage.getItem(k));}catch(e){}
    }
  }
  return years;
}

function countEntries(){
  const all=getAllStoredYears();
  let total=0;
  for(const y in all) total+=Object.keys(all[y]).length;
  return total;
}

function updateDataInfo(){
  const n=countEntries();
  document.getElementById('data-info').textContent=n>0?n+' dag'+(n===1?'':'en')+' opgeslagen':'';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',2200);
}

function render(){
  document.getElementById('year-label').textContent=currentYear;
  data=loadYear(currentYear);
  updateDataInfo();
  const wrap=document.getElementById('grid-wrap');
  let html='<table><thead><tr><th class="month-head"></th>';
  for(let d=1;d<=31;d++) html+='<th>'+d+'</th>';
  html+='</tr></thead><tbody>';
  for(let m=0;m<12;m++){
    const days=DAYS_IN_MONTH(currentYear,m);
    html+='<tr><td class="month-name">'+MONTHS_NL[m]+'</td>';
    for(let d=1;d<=31;d++){
      if(d>days){html+='<td class="day-cell empty"></td>';continue;}
      const k=dayKey(m,d);
      const entry=data[k]||{};
      const isWE=IS_WEEKEND(currentYear,m,d);
      const isToday=currentYear===TODAY.getFullYear()&&m===TODAY.getMonth()&&d===TODAY.getDate();
      let cls='day-cell';
      let style='';
      if(isWE) cls+=' weekend';
      if(entry.color&&!isWE){cls+=' colored';style='background:'+entry.color+';';if(LIGHT_COLORS.has(entry.color))cls+=' light-color';}
      if(entry.note) cls+=' has-note';
      if(isToday) cls+=' today';
      html+='<td class="'+cls+'" style="'+style+'" data-m="'+m+'" data-d="'+d+'"><span>'+d+'</span></td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.day-cell:not(.empty)').forEach(cell=>{
    cell.addEventListener('click',onCellClick);
    cell.addEventListener('mouseenter',onCellHover);
    cell.addEventListener('mouseleave',hideTooltip);
  });
}

function onCellHover(e){
  const m=parseInt(e.currentTarget.dataset.m);
  const d=parseInt(e.currentTarget.dataset.d);
  const entry=data[dayKey(m,d)]||{};
  if(!entry.note&&!entry.color) return hideTooltip();
  const tip=document.getElementById('tooltip');
  let html='<strong>'+d+' '+MONTHS_NL[m]+'</strong>';
  if(entry.note) html+='<br>'+entry.note;
  tip.innerHTML=html;
  tip.style.display='block';
  const r=e.currentTarget.getBoundingClientRect();
  tip.style.left=(r.left+window.scrollX)+'px';
  tip.style.top=(r.bottom+window.scrollY+4)+'px';
}
function hideTooltip(){document.getElementById('tooltip').style.display='none';}

function onCellClick(e){
  const cell=e.currentTarget;
  const m=parseInt(cell.dataset.m);
  const d=parseInt(cell.dataset.d);
  pickerTarget={m,d};
  const entry=data[dayKey(m,d)]||{};
  document.getElementById('note-input').value=entry.note||'';
  selectedColor=entry.color||COLORS[0];
  renderColorGrid();
  const pw=document.getElementById('color-picker-wrap');
  pw.classList.add('open');
  const r=cell.getBoundingClientRect();
  let left=r.left+window.scrollX;
  let top=r.bottom+window.scrollY+4;
  if(left+230>window.innerWidth) left=window.innerWidth-240;
  pw.style.left=left+'px';
  pw.style.top=top+'px';
  e.stopPropagation();
}

function renderColorGrid(){
  const grid=document.getElementById('color-grid');
  grid.innerHTML=COLORS.map(c=>'<div class="color-swatch'+(c===selectedColor?' selected':'')+'" style="background:'+c+'" data-c="'+c+'"></div>').join('');
  grid.querySelectorAll('.color-swatch').forEach(s=>s.addEventListener('click',e=>{
    selectedColor=e.currentTarget.dataset.c;
    renderColorGrid();
  }));
}

document.getElementById('save-btn').addEventListener('click',()=>{
  if(!pickerTarget) return;
  const k=dayKey(pickerTarget.m,pickerTarget.d);
  const note=document.getElementById('note-input').value.trim();
  if(selectedColor||note){data[k]={color:selectedColor,note};}
  else{delete data[k];}
  saveYear(currentYear,data);
  closePicker();
  render();
});

document.getElementById('clear-btn').addEventListener('click',()=>{
  if(!pickerTarget) return;
  delete data[dayKey(pickerTarget.m,pickerTarget.d)];
  saveYear(currentYear,data);
  closePicker();
  render();
});

function closePicker(){document.getElementById('color-picker-wrap').classList.remove('open');pickerTarget=null;}
document.addEventListener('click',e=>{if(!document.getElementById('color-picker-wrap').contains(e.target))closePicker();});

document.getElementById('prev-yr').addEventListener('click',()=>{currentYear--;render();});
document.getElementById('next-yr').addEventListener('click',()=>{currentYear++;render();});

document.getElementById('export-btn').addEventListener('click',()=>{
  const all=getAllStoredYears();
  const blob=new Blob([JSON.stringify({versie:1,export:new Date().toISOString().slice(0,10),jaren:all},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='jaaragenda_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  showToast('Backup gedownload ✓');
});

document.getElementById('import-btn').addEventListener('click',()=>{
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result);
      const jaren=parsed.jaren||parsed;
      let count=0;
      for(const y in jaren){
        localStorage.setItem(storageKey(y),JSON.stringify(jaren[y]));
        count+=Object.keys(jaren[y]).length;
      }
      data=loadYear(currentYear);
      render();
      showToast('Geïmporteerd: '+count+' dagen uit '+Object.keys(jaren).length+' jaar/jaren ✓');
    }catch(err){
      showToast('Fout: bestand niet herkend');
    }
  };
  reader.readAsText(file);
  e.target.value='';
});

renderColorGrid();
render();
</script>
</body>
</html>
